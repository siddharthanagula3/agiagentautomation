# CodeQL custom configuration file
# Ref: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning

name: "CodeQL Exclusions Configuration"

paths-ignore:
  - '**/node_modules/**'
  - '**/bower_components/**'
  - 'dist/**'
  - '.netlify/**'
  - 'playwright-report/**'
  - 'test-results/**'
  - 'scripts/**'
  - 'fastlane/**'
  - 'ios/**'
  - 'k8s/**'
  - 'supabase/migrations/**'
  - 'e2e/**'
  - 'tests/**'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - '**/*.test.tsx'
  - '**/*.spec.tsx'
  - '**/*.test.js'
  - '**/*.spec.js'
