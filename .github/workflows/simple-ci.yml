name: Simple CI/CD Pipeline

on:
  push:
    branches: [main, develop, restructure/repository]
  pull_request:
    branches: [main, develop]

# Permissions for security scanning
permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ─── Security Scanning ────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (warn on high, fail on critical)
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=high || echo "::warning::npm audit found high severity vulnerabilities - review and update"
          npm audit --audit-level=critical

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Check for hardcoded secrets patterns in source
        run: |
          echo "Scanning source files for potential hardcoded secrets..."
          PATTERNS=(
            'sk-[a-zA-Z0-9]{48,}'
            'sk_live_[a-zA-Z0-9]{20,}'
            'sk_test_[a-zA-Z0-9]{20,}'
            'whsec_[a-zA-Z0-9]{20,}'
          )

          FOUND_SECRETS=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rE "$pattern" \
              --include="*.ts" --include="*.tsx" --include="*.js" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              --exclude="*.example" --exclude="*.test.*" --exclude="*.spec.*" \
              --exclude="*.env*" \
              . 2>/dev/null | \
              grep -v "process\.env" | grep -v "import\.meta\.env" | \
              grep -v "SECRETS_SCAN_OMIT" | head -5 || true)
            if [ -n "$MATCHES" ]; then
              echo "::warning::Potential secret pattern found: $pattern"
              echo "$MATCHES"
              FOUND_SECRETS=1
            fi
          done

          if [ $FOUND_SECRETS -eq 1 ]; then
            echo "::warning::Review the above files for potential hardcoded secrets"
          else
            echo "No hardcoded secrets detected in source files"
          fi

      - name: License compliance check
        run: |
          echo "Checking license compliance..."
          npx license-checker --summary --production || echo "::warning::license-checker could not complete"

  # ─── Dependency Review (PR only) ──────────────────────────────────
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense

  # ─── Quality Checks ───────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Prettier check
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

  # ─── Build ────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build:prod
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_URL: https://agiagentautomation.vercel.app
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Report build size
        run: |
          echo "Build completed successfully!"
          du -sh dist/
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Bundle Size (informational, non-blocking) ────────────────────
  bundle-size:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check bundle sizes
        run: npm run size || echo "::warning::Bundle size check could not complete"

  # ─── Unit Tests ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test:run

  # ─── E2E Tests (non-blocking in CI, informational) ────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create screenshots directory
        run: mkdir -p e2e/screenshots

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Final Status Gate ────────────────────────────────────────────
  status:
    needs: [security, quality, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate required check results
        run: |
          echo "============================================"
          echo "CI Pipeline Status Summary"
          echo "============================================"
          echo "Security:  ${{ needs.security.result }}"
          echo "Quality:   ${{ needs.quality.result }}"
          echo "Build:     ${{ needs.build.result }}"
          echo "Tests:     ${{ needs.test.result }}"
          echo "============================================"

          FAILED=0

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "FAILED: Security checks failed"
            FAILED=1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "FAILED: Build failed"
            FAILED=1
          fi

          if [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "FAILED: Quality checks failed"
            FAILED=1
          fi

          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "FAILED: Unit tests failed"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

          echo "SUCCESS: All required checks passed!"
          exit 0
